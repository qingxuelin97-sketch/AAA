<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Quiet Aqua Discover character screen vector trace</title>
  <desc id="desc">Full bleed discovery screen. The illustrated character is represented by vector silhouette geometry marked dynamic media.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9BC6D4"/><stop offset=".47" stop-color="#6A98A8"/><stop offset="1" stop-color="#163E49"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7EAAB5"/><stop offset="1" stop-color="#315E6B"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102B29" stop-opacity="0"/><stop offset=".45" stop-color="#102B29" stop-opacity=".08"/><stop offset="1" stop-color="#071B21" stop-opacity=".94"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#07928E"/><stop offset="1" stop-color="#0B7773"/></linearGradient>
    <filter id="glassShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#071B21" flood-opacity=".23"/></filter>
    <style>
      text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.white{fill:#FFFFFF}.soft{fill:#D8E7E8}.line{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.glass{fill:#FFFFFF;fill-opacity:.18;stroke:#FFFFFF;stroke-opacity:.58;stroke-width:1}.meta{font-size:11px}.body{font-size:13px}.tiny{font-size:8px;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="390" height="844" fill="url(#sky)"/>

  <!-- Vector-only dynamic media field -->
  <g aria-label="dynamic media background placeholder">
    <path d="M0 188L55 150l52 27 51-35 41 19 42-34 55 32 43-20 51 20v267H0z" fill="#D5E4E3" opacity=".22"/>
    <path d="M0 297c72-21 122-12 177 6 67 21 135 8 213-18v210H0z" fill="url(#water)" opacity=".76"/>
    <path d="M0 421c57-19 105-14 156 1 82 24 153 23 234-6v172H0z" fill="#274F5C" opacity=".46"/>
    <path d="M-12 47c80 7 129-13 190-54M145 0c29 22 49 51 67 91M196 15c63 18 119 11 211-11" fill="none" stroke="#ECF6F4" stroke-width="3" opacity=".35"/>
    <path d="M13 126l37-21 52 11-48 21zM327 115l31-20 43 13-30 27z" fill="#E6F0EF" opacity=".33"/>
    <text x="18" y="220" fill="#FFFFFF" opacity=".68" class="tiny">DYNAMIC MEDIA · FULL BLEED</text>
  </g>

  <!-- Character silhouette, intentionally non-photographic -->
  <g aria-label="dynamic media character placeholder">
    <path d="M120 660c11-109 2-220 36-330 13-43 45-87 98-88 55-1 83 42 91 93 18 111-1 222 20 325z" fill="#D8E3E3" opacity=".76"/>
    <ellipse cx="245" cy="266" rx="50" ry="63" fill="#E8EFEC" opacity=".96"/>
    <path d="M184 294c-3-89 34-125 79-121 48 4 72 55 53 148-22-40-41-64-75-78-10 28-28 43-57 51z" fill="#183841"/>
    <path d="M175 274c-50 74-76 173-53 279M319 251c51 93 66 194 37 307M183 226c-66 76-111 124-164 140M290 208c37 65 64 115 91 193" fill="none" stroke="#17323A" stroke-width="12" stroke-linecap="round" opacity=".85"/>
    <path d="M196 404c21 34 47 53 78 53 26 0 49-15 68-44M164 546c77 22 141 22 198-4" fill="none" stroke="#B8CACA" stroke-width="1.2" opacity=".9"/>
  </g>
  <rect width="390" height="844" fill="url(#shade)"/>

  <!-- Top controls: y 48-88, 44 point targets -->
  <g filter="url(#glassShadow)" aria-label="back"><rect x="22" y="50" width="42" height="44" rx="15" class="glass"/><path d="M46 64l-8 8 8 8" class="line"/></g>
  <g text-anchor="middle" font-size="14" font-weight="650"><text x="139" y="74" class="soft">关注</text><text x="195" y="74" class="white" font-size="16" font-weight="750">推荐</text><text x="251" y="74" class="soft">新作</text><path d="M183 85h24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></g>
  <g filter="url(#glassShadow)" aria-label="search"><rect x="326" y="50" width="42" height="44" rx="15" class="glass"/><circle cx="345" cy="69" r="8" class="line"/><path d="M351 75l6 6" class="line"/></g>

  <!-- Social action rail: x 340-376, y 322-620 -->
  <g transform="translate(354 340)" text-anchor="middle"><path d="M0 10L-9 1a8 8 0 0111-11l2 2 2-2A8 8 0 0117 1L8 10 4 14z" transform="translate(-4)" class="line"/><text y="34" class="white meta">2.1万</text></g>
  <g transform="translate(354 402)" text-anchor="middle"><path d="M0-12l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" class="line"/><text y="32" class="white meta">9,326</text></g>
  <g transform="translate(354 470)" text-anchor="middle"><path d="M-11-9h22v15H1l-7 6V6h-5z" class="line"/><text y="30" class="white meta">1,305</text></g>
  <g transform="translate(354 538)" text-anchor="middle"><path d="M-12 7c1-10 7-16 17-18v-7l13 12-13 12v-7C-2 0-7 3-12 7z" class="line"/><text y="28" class="white meta">842</text></g>
  <g transform="translate(354 600)" text-anchor="middle"><path d="M0-12a12 12 0 11-10 5M-10-7v-8m0 0l-5 5m5-5l5 5" class="line"/><text y="27" class="soft meta">浏览记录</text></g>

  <!-- Identity and description: y 570-727 -->
  <text x="29" y="603" class="white" font-size="29" font-weight="780">沈知微</text>
  <g transform="translate(146 592)"><circle r="8" fill="#0A9691" stroke="#99E2DF"/><path d="M-3 0l2 3 5-6" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></g>
  <text x="30" y="630" class="soft" font-size="12">◎ 云溪阁谋士 · 机敏聪慧</text>
  <text x="30" y="657" class="white body">云顶 38 层的灯，总是最后一个熄。</text>
  <text x="30" y="679" class="white body">她说她不信命，却做尽了违命的事。</text>
  <g transform="translate(30 710)"><circle cx="15" cy="0" r="15" fill="#DDE9E8"/><path d="M6 10c2-12 5-19 10-19s9 7 10 19" fill="#355B62"/><text x="44" y="4" class="soft" font-size="12">创作者：幻域官方</text><circle cx="130" cy="0" r="8" fill="#F1B840"/><text x="130" y="3" text-anchor="middle" class="white" font-size="8">◆</text></g>

  <!-- Primary controls: y 742-810 -->
  <g aria-label="enter chat, 62 point control" filter="url(#glassShadow)"><rect x="23" y="742" width="269" height="62" rx="23" fill="url(#teal)" stroke="#28AAA4"/><path d="M108 761h20v15h-8l-5 5v-5h-7zM122 766h12v12" class="line"/><text x="144" y="779" class="white" font-size="18" font-weight="750">进入对话</text></g>
  <g aria-label="call, 62 point control" filter="url(#glassShadow)"><rect x="305" y="742" width="62" height="62" rx="23" fill="#FFFFFF" fill-opacity=".92" stroke="#FFFFFF"/><path d="M329 761c4 10 8 14 18 18l5-6-7-5-4 4c-4-2-7-5-9-9l4-4-4-7z" fill="none" stroke="#0A5554" stroke-width="2" stroke-linejoin="round"/></g>
  <rect x="23" y="742" width="269" height="62" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".14"/>
</svg>
