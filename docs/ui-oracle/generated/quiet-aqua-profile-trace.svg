<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Quiet Aqua Profile screen vector trace</title>
  <desc id="desc">Profile hierarchy, account surfaces, content cards, and touch targets rendered in pure SVG.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FAFBFA"/><stop offset="1" stop-color="#F0F5F4"/></linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FBFA"/><stop offset=".65" stop-color="#EDF7F5"/><stop offset="1" stop-color="#D7EDEB"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFF9E9"/><stop offset=".5" stop-color="#FFF4D5"/><stop offset="1" stop-color="#FFF9EC"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13A19B"/><stop offset="1" stop-color="#087F79"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#173C3A" flood-opacity=".09"/></filter>
    <style>
      text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102B29}.muted{fill:#6B7E7C}.teal{fill:#087F79}.gold{fill:#956515}.line{stroke:#D6E2DF;stroke-width:1}.icon{fill:none;stroke:#087F79;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.body{font-size:11px}.meta{font-size:9px}.hot{fill:#FFFFFF;stroke:#D6E2DF}
    </style>
    <g id="portrait"><rect x="-48" y="-45" width="96" height="90" rx="11" fill="#DDEAE8"/><ellipse cy="-11" rx="17" ry="22" fill="#E9F0EE"/><path d="M-19-10c-2-31 9-42 22-42 19 0 28 19 21 46-7-13-14-22-25-27-3 12-9 18-18 23z" fill="#294C53"/><path d="M-38 42c4-35 15-48 38-48s34 13 38 48" fill="#557A7E"/><text y="40" text-anchor="middle" fill="#FFFFFF" font-size="6" opacity=".9">dynamic media</text></g>
  </defs>
  <rect width="390" height="844" fill="url(#page)"/>

