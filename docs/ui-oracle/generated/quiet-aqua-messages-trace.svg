<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Quiet Aqua Messages screen vector trace</title>
  <desc id="desc">Messages information architecture and touch geometry rendered as pure SVG.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FAFBFA"/><stop offset="1" stop-color="#F0F5F4"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14A19B"/><stop offset="1" stop-color="#087F79"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#173C3A" flood-opacity=".09"/></filter>
    <style>
      text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#102B29}.muted{fill:#6B7E7C}.teal{fill:#087F79}.line{stroke:#DCE6E4;stroke-width:1}.icon{fill:none;stroke:#0B8E89;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.body{font-size:11px}.meta{font-size:10px}.hot{fill:#FFFFFF;stroke:#D6E2DF}
    </style>
    <g id="avatar"><circle r="25" fill="#DDEAE8"/><circle cy="-6" r="8" fill="#76999D"/><path d="M-15 19c2-14 7-20 15-20s13 6 15 20" fill="#496E73"/><text y="32" text-anchor="middle" fill="#087F79" font-size="5">dynamic media</text></g>
  </defs>
  <rect width="390" height="844" fill="url(#page)"/>

  <!-- Header and segmented control -->
  <text x="21" y="69" class="ink" font-size="24" font-weight="760">消息</text>
  <g aria-label="search, 44 point target"><rect x="330" y="42" width="40" height="42" rx="14" class="hot"/><circle cx="347" cy="59" r="8" fill="none" stroke="#102B29" stroke-width="1.8"/><path d="M353 65l6 6" stroke="#102B29" stroke-width="1.8" stroke-linecap="round"/></g>
  <g aria-label="message category segmented control"><rect x="20" y="91" width="350" height="35" rx="15" fill="#F2F6F5" stroke="#DCE6E4"/><rect x="22" y="93" width="171" height="31" rx="13" fill="#FFFFFF" stroke="#D6E2DF" filter="url(#shadow)"/><text x="107" y="115" text-anchor="middle" class="ink" font-size="13" font-weight="700">聊过</text><text x="281" y="115" text-anchor="middle" class="muted" font-size="13" font-weight="650">赞过</text></g>

  <!-- System destinations: card y 139-327, rows are 62 high -->
  <rect x="18" y="139" width="354" height="188" rx="16" fill="#FFFFFF" stroke="#D6E2DF" filter="url(#shadow)"/>
  <g transform="translate(30 151)"><rect width="42" height="42" rx="11" fill="#EDF7F6"/><path d="M15 26v-9a6 6 0 0112 0v9l3 4H12zM19 33h4" class="icon"/><text x="57" y="14" class="ink" font-size="14" font-weight="700">互动消息</text><text x="57" y="33" class="muted body">有人回应了你的故事或评论</text><path d="M322 15l5 6-5 6" fill="none" stroke="#6B7E7C" stroke-width="1.5"/><path d="M0 50h330" class="line"/></g>
  <g transform="translate(30 214)"><rect width="42" height="42" rx="11" fill="#EDF7F6"/><path d="M11 19l21-9-7 23-5-9-9-5zM20 24l7-8" class="icon"/><text x="57" y="14" class="ink" font-size="14" font-weight="700">好友私信</text><text x="57" y="33" class="muted body">新消息和私信通知</text><path d="M322 15l5 6-5 6" fill="none" stroke="#6B7E7C" stroke-width="1.5"/><path d="M0 50h330" class="line"/></g>
  <g transform="translate(30 277)"><rect width="42" height="42" rx="11" fill="#EDF7F6"/><circle cx="18" cy="18" r="6" class="icon"/><circle cx="28" cy="20" r="5" class="icon"/><path d="M8 35c1-9 5-12 10-12s9 3 10 12M27 26c6 0 9 4 9 10" class="icon"/><text x="57" y="14" class="ink" font-size="14" font-weight="700">群聊房间</text><text x="57" y="33" class="muted body">你加入的群聊更新</text><path d="M322 15l5 6-5 6" fill="none" stroke="#6B7E7C" stroke-width="1.5"/></g>

  <!-- Conversation list -->
  <text x="21" y="352" class="ink" font-size="15" font-weight="720">与角色的对话</text>
  <rect x="18" y="362" width="354" height="398" rx="16" fill="#FFFFFF" stroke="#D6E2DF" filter="url(#shadow)"/>
  <g transform="translate(42 392)"><use href="#avatar"/><text x="41" y="-8" class="ink" font-size="14" font-weight="700">陆沉舟</text><text x="41" y="15" class="muted body">今晚的月色很好，想和你一起去看海。</text><text x="328" y="-8" text-anchor="end" class="muted meta">14:32</text><circle cx="320" cy="13" r="8" fill="#EF5A3E"/><text x="320" y="17" text-anchor="middle" fill="#FFFFFF" font-size="9">2</text><path d="M-12 35h342" class="line"/></g>
  <g transform="translate(42 458)"><use href="#avatar"/><text x="41" y="-8" class="ink" font-size="14" font-weight="700">沈知微</text><text x="41" y="15" class="muted body">云顶的灯亮了，我在这里等你。</text><text x="328" y="-8" text-anchor="end" class="muted meta">13:05</text><circle cx="320" cy="13" r="8" fill="#EF5A3E"/><text x="320" y="17" text-anchor="middle" fill="#FFFFFF" font-size="9">1</text><path d="M-12 35h342" class="line"/></g>
  <g transform="translate(42 524)"><use href="#avatar"/><text x="41" y="-8" class="ink" font-size="14" font-weight="700">苏宴</text><text x="41" y="15" class="muted body">别多想，按我们说好的去做就行。</text><text x="328" y="-8" text-anchor="end" class="muted meta">10:48</text><path d="M-12 35h342" class="line"/></g>
  <g transform="translate(42 590)"><use href="#avatar"/><text x="41" y="-8" class="ink" font-size="14" font-weight="700">林疏月</text><text x="41" y="15" class="muted body">谢谢你送我的风铃，我很喜欢。</text><text x="328" y="-8" text-anchor="end" class="muted meta">昨天 21:17</text><path d="M-12 35h342" class="line"/></g>
  <g transform="translate(42 656)"><use href="#avatar"/><text x="41" y="-8" class="ink" font-size="14" font-weight="700">谢临渊</text><text x="41" y="15" class="muted body">有空一起去书店，那里新到了一批书。</text><text x="328" y="-8" text-anchor="end" class="muted meta">昨天 18:42</text><path d="M-12 35h342" class="line"/></g>
  <g transform="translate(42 722)"><use href="#avatar"/><text x="41" y="-8" class="ink" font-size="14" font-weight="700">顾延之</text><text x="41" y="15" class="muted body">晚安，好梦。</text><text x="328" y="-8" text-anchor="end" class="muted meta">昨天 00:36</text><circle cx="320" cy="13" r="8" fill="#EF5A3E"/><text x="320" y="17" text-anchor="middle" fill="#FFFFFF" font-size="9">1</text></g>

  <!-- Dock: 4 tabs plus separate create accessory -->
  <g filter="url(#shadow)"><rect x="18" y="766" width="354" height="62" rx="24" fill="#FFFFFF" fill-opacity=".93" stroke="#D6E2DF"/></g>
  <g text-anchor="middle" font-size="10">
    <g transform="translate(55 786)"><path d="M-8 0l8-7 8 7v9h-16z" fill="none" stroke="#47615E" stroke-width="1.7"/><text y="27" class="ink">今日</text></g>
    <g transform="translate(124 786)"><circle r="8" fill="none" stroke="#47615E" stroke-width="1.7"/><path d="M-4 4l2-6 6-2-2 6z" fill="none" stroke="#47615E" stroke-width="1.4"/><text y="27" class="ink">发现</text></g>
    <g transform="translate(266 786)"><path d="M-8-4h16v10h-9l-5 4V6h-2z" fill="#087F79"/><circle cx="8" cy="-7" r="7" fill="#EF5A3E"/><text x="8" y="-4" fill="#FFFFFF" font-size="8">3</text><text y="27" class="teal" font-weight="700">消息</text></g>
    <g transform="translate(335 786)"><circle cy="-3" r="5" fill="none" stroke="#47615E" stroke-width="1.7"/><path d="M-8 10c1-7 4-9 8-9s7 2 8 9" fill="none" stroke="#47615E" stroke-width="1.7"/><text y="27" class="ink">我的</text></g>
  </g>
  <g aria-label="create accessory, 56 point target"><circle cx="195" cy="785" r="32" fill="#EFF7F6" stroke="#D6E2DF"/><circle cx="195" cy="785" r="25" fill="url(#teal)"/><path d="M195 774v22M184 785h22" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g>
</svg>
