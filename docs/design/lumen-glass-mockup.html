  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f8ba2cd0-463e-403b-9980-80d733cea79d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>幻域 · 曜光玻璃 Lumen Glass v1.0 — 全局 App 设计稿<\u002Ftitle>\n<style>\n:root{\n  --f:\"Microsoft YaHei\",\"PingFang SC\",\"Hiragino Sans GB\",\"Heiti SC\",system-ui,sans-serif;\n  --m:ui-monospace,\"Cascadia Mono\",\"SFMono-Regular\",Consolas,\"Microsoft YaHei\",monospace;\n  --serif:\"Songti SC\",\"SimSun\",\"Noto Serif SC\",serif;\n  --zoom:1;\n  --r-xs:8px;--r-sm:10px;--r-ctl:12px;--r-row:14px;--r-card:18px;--r-panel:20px;--r-sheet:26px;--r-pill:999px;\n  --ease:cubic-bezier(.2,.8,.2,1);\n}\n/* ── 深色（默认） ───────────────────────────── */\n:root,:root[data-lg-theme=\"dark\"]{\n  color-scheme:dark;\n  --bg:#0A0C12;--bg2:#10131B;--fin:#141926;\n  --ink:#F2F4F9;--ink2:#A8B0C2;--ink3:#767E92;--line:rgb(255 255 255/10%);\n  --g1:rgb(255 255 255/5.5%);--g2:rgb(255 255 255/9%);--g3:rgb(14 17 25/52%);--gsel:rgb(255 255 255/14%);\n  --gs1:inset 0 0 0 1px rgb(255 255 255/10%),inset 0 1px 0 rgb(255 255 255/13%),0 8px 24px rgb(0 0 0/34%);\n  --gs2:inset 0 0 0 1px rgb(255 255 255/14%),inset 0 1px 0 rgb(255 255 255/18%),0 16px 40px rgb(0 0 0/46%);\n  --gs3:inset 0 0 0 1px rgb(255 255 255/12%),inset 0 1px 0 rgb(255 255 255/16%),0 -1px 30px rgb(0 0 0/50%);\n  --bl:blur(28px) saturate(150%);--bl-s:blur(16px) saturate(140%);\n  --azure:oklch(.80 .11 240);--violet:oklch(.78 .12 305);--rose:oklch(.79 .11 350);\n  --coral:oklch(.76 .15 25);--gold:oklch(.83 .12 85);--dia:oklch(.82 .10 215);--jade:oklch(.80 .11 158);\n  --amb:radial-gradient(120% 82% at 10% -10%,oklch(.58 .16 278/38%),transparent 62%),radial-gradient(96% 66% at 96% 4%,oklch(.62 .13 205/22%),transparent 60%),radial-gradient(130% 74% at 46% 112%,oklch(.56 .13 322/24%),transparent 62%);\n  --amb-warm:radial-gradient(120% 82% at 8% -10%,oklch(.62 .14 78/34%),transparent 62%),radial-gradient(100% 70% at 98% 10%,oklch(.55 .14 30/22%),transparent 60%),radial-gradient(130% 74% at 50% 114%,oklch(.55 .12 300/18%),transparent 62%);\n  --amb-cool:radial-gradient(120% 82% at 12% -8%,oklch(.60 .13 215/34%),transparent 62%),radial-gradient(100% 70% at 96% 6%,oklch(.58 .14 258/24%),transparent 60%),radial-gradient(130% 74% at 44% 112%,oklch(.58 .11 178/18%),transparent 62%);\n  --amb-rose:radial-gradient(120% 82% at 10% -10%,oklch(.58 .14 348/34%),transparent 62%),radial-gradient(100% 70% at 96% 8%,oklch(.58 .14 300/22%),transparent 60%),radial-gradient(130% 74% at 48% 112%,oklch(.58 .12 26/18%),transparent 62%);\n  --ph:repeating-linear-gradient(135deg,rgb(255 255 255/3%) 0 7px,rgb(255 255 255/7%) 7px 14px);\n  --skel:linear-gradient(90deg,rgb(255 255 255/5%) 0%,rgb(255 255 255/11%) 50%,rgb(255 255 255/5%) 100%);\n  --bezel:0 0 0 1px rgb(255 255 255/12%),0 2px 0 0 rgb(255 255 255/6%) inset,0 40px 90px rgb(0 0 0/50%);\n  --doc:#07080C;--doc2:#0D1017;\n}\n:root[data-lg-theme=\"light\"]{\n  color-scheme:light;\n  --bg:#EDEFF6;--bg2:#E3E7F0;--fin:#1B2233;\n  --ink:#12151E;--ink2:#525A6E;--ink3:#7C8497;--line:rgb(16 22 40/10%);\n  --g1:rgb(255 255 255/58%);--g2:rgb(255 255 255/78%);--g3:rgb(250 251 255/60%);--gsel:rgb(255 255 255/92%);\n  --gs1:inset 0 0 0 1px rgb(255 255 255/70%),inset 0 1px 0 rgb(255 255 255/90%),0 6px 18px rgb(18 24 44/10%);\n  --gs2:inset 0 0 0 1px rgb(255 255 255/82%),inset 0 1px 0 rgb(255 255 255/95%),0 14px 34px rgb(18 24 44/14%);\n  --gs3:inset 0 0 0 1px rgb(255 255 255/78%),inset 0 1px 0 rgb(255 255 255/92%),0 -1px 24px rgb(18 24 44/12%);\n  --bl:blur(26px) saturate(170%);--bl-s:blur(14px) saturate(150%);\n  --azure:oklch(.53 .13 240);--violet:oklch(.52 .16 305);--rose:oklch(.53 .14 350);\n  --coral:oklch(.55 .19 25);--gold:oklch(.58 .13 82);--dia:oklch(.55 .12 215);--jade:oklch(.52 .12 158);\n  --amb:radial-gradient(120% 82% at 10% -10%,oklch(.72 .13 278/45%),transparent 62%),radial-gradient(96% 66% at 96% 4%,oklch(.80 .10 205/38%),transparent 60%),radial-gradient(130% 74% at 46% 112%,oklch(.78 .10 322/32%),transparent 62%);\n  --amb-warm:radial-gradient(120% 82% at 8% -10%,oklch(.85 .11 82/48%),transparent 62%),radial-gradient(100% 70% at 98% 10%,oklch(.78 .11 32/32%),transparent 60%),radial-gradient(130% 74% at 50% 114%,oklch(.78 .09 300/26%),transparent 62%);\n  --amb-cool:radial-gradient(120% 82% at 12% -8%,oklch(.80 .10 215/44%),transparent 62%),radial-gradient(100% 70% at 96% 6%,oklch(.76 .11 258/32%),transparent 60%),radial-gradient(130% 74% at 44% 112%,oklch(.82 .09 178/26%),transparent 62%);\n  --amb-rose:radial-gradient(120% 82% at 10% -10%,oklch(.78 .11 348/42%),transparent 62%),radial-gradient(100% 70% at 96% 8%,oklch(.78 .11 300/30%),transparent 60%),radial-gradient(130% 74% at 48% 112%,oklch(.80 .10 26/26%),transparent 62%);\n  --ph:repeating-linear-gradient(135deg,rgb(16 22 40/4%) 0 7px,rgb(16 22 40/9%) 7px 14px);\n  --skel:linear-gradient(90deg,rgb(16 22 40/5%) 0%,rgb(16 22 40/10%) 50%,rgb(16 22 40/5%) 100%);\n  --bezel:0 0 0 1px rgb(16 22 40/12%),0 40px 90px rgb(18 24 44/26%);\n  --doc:#07080C;--doc2:#0D1017;\n}\n/* 主动作色（选中、主按钮、焦点）—— 唯一可被用户改写的语义 */\n:root,:root[data-lg-accent=\"iris\"]{--act:oklch(.78 .13 278);--act-ink:#0B0C18;--act-soft:oklch(.78 .13 278/18%);}\n:root[data-lg-accent=\"azure\"]{--act:oklch(.80 .11 238);--act-ink:#06121C;--act-soft:oklch(.80 .11 238/18%);}\n:root[data-lg-accent=\"violet\"]{--act:oklch(.78 .12 312);--act-ink:#150A18;--act-soft:oklch(.78 .12 312/18%);}\n:root[data-lg-accent=\"jade\"]{--act:oklch(.80 .11 158);--act-ink:#04140D;--act-soft:oklch(.80 .11 158/18%);}\n:root[data-lg-accent=\"clay\"]{--act:oklch(.79 .12 44);--act-ink:#1A0C05;--act-soft:oklch(.79 .12 44/18%);}\n:root[data-lg-theme=\"light\"],:root[data-lg-theme=\"light\"][data-lg-accent=\"iris\"]{--act:oklch(.52 .17 278);--act-ink:#fff;--act-soft:oklch(.52 .17 278/12%);}\n:root[data-lg-theme=\"light\"][data-lg-accent=\"azure\"]{--act:oklch(.52 .14 238);--act-ink:#fff;--act-soft:oklch(.52 .14 238/12%);}\n:root[data-lg-theme=\"light\"][data-lg-accent=\"violet\"]{--act:oklch(.50 .17 312);--act-ink:#fff;--act-soft:oklch(.50 .17 312/12%);}\n:root[data-lg-theme=\"light\"][data-lg-accent=\"jade\"]{--act:oklch(.50 .12 158);--act-ink:#fff;--act-soft:oklch(.50 .12 158/12%);}\n:root[data-lg-theme=\"light\"][data-lg-accent=\"clay\"]{--act:oklch(.53 .14 44);--act-ink:#fff;--act-soft:oklch(.53 .14 44/12%);}\n/* lite 性能档：关闭全部模糊，玻璃回落为不透明面，层级与对比度不变 */\n:root[data-lg-perf=\"lite\"]{--bl:none;--bl-s:none;--g1:var(--bg2);--g2:var(--bg2);--g3:var(--bg2);}\nhtml,body{margin:0;padding:0;background:var(--doc);}\nbody{font-family:var(--f);color:#E7EAF2;-webkit-font-smoothing:antialiased;text-wrap:pretty;}\n*{box-sizing:border-box;}\na{color:oklch(.80 .12 278);text-decoration:none;}\na:hover{color:oklch(.88 .10 278);}\n@keyframes shim{0%{background-position:-160% 0}100%{background-position:260% 0}}\n@keyframes spin{to{transform:rotate(360deg)}}\n@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--doc);padding:0 0 120px\">\n\n<div style=\"position:sticky;top:0;z-index:80;background:rgb(7 8 12/78%);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:0 1px 0 rgb(255 255 255/8%);padding:14px 40px;display:flex;align-items:center;gap:24px;flex-wrap:wrap\">\n  <div style=\"display:flex;flex-direction:column;gap:2px\">\n    <span style=\"font:700 15px/1.2 var(--f);letter-spacing:.02em;color:#F4F6FB\">幻域 · 曜光玻璃 Lumen Glass<\u002Fspan>\n    <span style=\"font:11px/1.2 var(--m);color:#7C8497\">v1.0 · 全局 App 设计稿 · 仅 App 壳（?app=1），Web 不适用<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-left:auto\">\n    <a href=\"#lang\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">设计语言<\u002Fa>\n    <a href=\"#comp\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">组件与状态<\u002Fa>\n    <a href=\"#motion\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">动效手势<\u002Fa>\n    <a href=\"#gA\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">一级 + 创建<\u002Fa>\n    <a href=\"#gB\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">沉浸与会话<\u002Fa>\n    <a href=\"#gC\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">索引列表<\u002Fa>\n    <a href=\"#gD\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">身份与价值<\u002Fa>\n    <a href=\"#gE\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">创作工作台<\u002Fa>\n    <a href=\"#gF\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">社区运营<\u002Fa>\n    <a href=\"#gG\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">表单与系统<\u002Fa>\n    <a href=\"#gH\" style=\"font:12px/1 var(--f);color:#C6CBD8;padding:9px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%)\">状态与降级<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:8px;align-items:center\">\n    <button type=\"button\" sc-camel-on-click=\"{{ setDark }}\" style=\"font:12px/1 var(--f);color:#E7EAF2;padding:10px 14px;border:0;border-radius:999px;background:{{ darkBtn }};box-shadow:inset 0 0 0 1px rgb(255 255 255/12%);cursor:pointer\">深色<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ setLight }}\" style=\"font:12px/1 var(--f);color:#E7EAF2;padding:10px 14px;border:0;border-radius:999px;background:{{ lightBtn }};box-shadow:inset 0 0 0 1px rgb(255 255 255/12%);cursor:pointer\">浅色<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1780px;margin:0 auto;padding:0 40px\">\n\n<section id=\"cover\" style=\"padding:72px 0 56px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:center\">\n  <div>\n    <div style=\"font:12px/1 var(--m);color:#6F7789;letter-spacing:.14em;text-transform:uppercase\">Design Draft · Mobile App Shell Only<\u002Fdiv>\n    <h1 style=\"font:700 60px/1.06 var(--f);letter-spacing:-.02em;margin:18px 0 0;color:#F6F8FC\">曜光玻璃<br><span style=\"color:#8B93A6;font-weight:400;font-size:34px;letter-spacing:0\">Lumen&nbsp;Glass&nbsp;v1.0<\u002Fspan><\u002Fh1>\n    <p style=\"font:16px/1.75 var(--f);color:#A8B0C2;margin:22px 0 0;max-width:62ch\">替代「静水青 v4.2」的全新视觉方向：内容仍是唯一主角，但所有控制层与承载层升级为<strong style=\"color:#E7EAF2;font-weight:600\">液态玻璃<\u002Fstrong>——背景是一层环境光晕，界面是浮在光上的多层折射面。层级、材质、深度、手势因果全部对标 Apple 的处理方式；不使用 SF 字体、SF Symbols 或任何受限资源。<\u002Fp>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 0\">\n      <span style=\"font:12px/1 var(--m);color:#C6CBD8;padding:10px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/10%)\">50 屏<\u002Fspan>\n      <span style=\"font:12px/1 var(--m);color:#C6CBD8;padding:10px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/10%)\">浅色 + 深色<\u002Fspan>\n      <span style=\"font:12px/1 var(--m);color:#C6CBD8;padding:10px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/10%)\">390×844 基准<\u002Fspan>\n      <span style=\"font:12px/1 var(--m);color:#C6CBD8;padding:10px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/10%)\">360×800 / 412×915 成立<\u002Fspan>\n      <span style=\"font:12px/1 var(--m);color:#C6CBD8;padding:10px 13px;border-radius:999px;background:rgb(255 255 255/6%);box-shadow:inset 0 0 0 1px rgb(255 255 255/10%)\">lite 档可降级<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font:13px/1.7 var(--m);color:#6F7789;margin:26px 0 0\">令牌 CSS → <code style=\"color:#9FA7BA\">docs/design/lumen-glass-tokens.css<\u002Fcode><br>实施规范 → <code style=\"color:#9FA7BA\">docs/design/LUMEN_GLASS_SPEC.md<\u002Fcode><br>给 Claude Code 的 prompt → <code style=\"color:#9FA7BA\">docs/design/CLAUDE_CODE_PROMPT.md<\u002Fcode><\u002Fp>\n  <\u002Fdiv>\n  <div style=\"position:relative;border-radius:32px;overflow:hidden;background:var(--bg);box-shadow:var(--bezel);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center\">\n    <div style=\"position:absolute;inset:0;background:var(--amb)\"><\u002Fdiv>\n    <div style=\"position:relative;display:grid;grid-template-columns:repeat(2,142px);gap:16px\">\n      <div style=\"height:96px;border-radius:var(--r-card);background:var(--g1);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);box-shadow:var(--gs1);padding:14px;display:flex;flex-direction:column;justify-content:space-between\">\n        <span style=\"font:11px/1 var(--m);color:var(--ink3)\">CONTENT GLASS<\u002Fspan>\n        <span style=\"font:600 15px/1 var(--f);color:var(--ink)\">承载层<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:96px;border-radius:var(--r-card);background:var(--g2);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);box-shadow:var(--gs2);padding:14px;display:flex;flex-direction:column;justify-content:space-between\">\n        <span style=\"font:11px/1 var(--m);color:var(--ink3)\">RAISED<\u002Fspan>\n        <span style=\"font:600 15px/1 var(--f);color:var(--ink)\">浮起层<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:96px;border-radius:var(--r-panel);background:var(--fin);box-shadow:var(--gs2);padding:14px;display:flex;flex-direction:column;justify-content:space-between\">\n        <span style=\"font:11px/1 var(--m);color:rgb(255 255 255/48%)\">FINANCE<\u002Fspan>\n        <span style=\"font:600 15px/1 var(--f);color:#F5F8FF\">资产实体<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:96px;border-radius:var(--r-pill);background:var(--act);box-shadow:var(--gs2);padding:14px;display:flex;flex-direction:column;justify-content:space-between\">\n        <span style=\"font:11px/1 var(--m);color:var(--act-ink);opacity:.6\">ACTION<\u002Fspan>\n        <span style=\"font:600 15px/1 var(--f);color:var(--act-ink)\">主动作<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"lang\" style=\"padding:40px 0 8px\">\n  <div style=\"display:flex;align-items:baseline;gap:14px;padding-bottom:22px;border-bottom:1px solid rgb(255 255 255/9%)\">\n    <h2 style=\"font:700 30px/1.1 var(--f);margin:0;color:#F4F6FB\">01 设计语言<\u002Fh2>\n    <span style=\"font:13px/1 var(--m);color:#6F7789\">令牌 · 材质 · 排版 · 几何 · 图标<\u002Fspan>\n  <\u002Fdiv>\n\n  <h3 style=\"font:600 17px/1 var(--f);color:#E7EAF2;margin:34px 0 14px\">语义色板 — 中性内容底 + 语义强调<\u002Fh3>\n  <p style=\"font:14px/1.7 var(--f);color:#8B93A6;margin:0 0 18px;max-width:88ch\">主动作色（iris/azure/violet/jade/clay）只负责主按钮、选中、焦点；金 / 钻 / 珊瑚 / 玉 / 靛 / 玫瑰是<strong style=\"color:#C6CBD8;font-weight:600\">内容语义<\u002Fstrong>，不随用户强调色漂移。禁止彩虹 nth-child、禁止无语义多色渐变。<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px\">\n    <div style=\"border-radius:var(--r-card);overflow:hidden;background:var(--g1);box-shadow:var(--gs1)\"><div style=\"height:64px;background:var(--act)\"><\u002Fdiv><div style=\"padding:11px 13px\"><div style=\"font:600 13px/1.3 var(--f);color:#E7EAF2\">主动作 action<\u002Fdiv><div style=\"font:11px/1.5 var(--m);color:#6F7789\">--act · 按钮/选中/焦点<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);overflow:hidden;background:var(--g1);box-shadow:var(--gs1)\"><div style=\"height:64px;background:var(--gold)\"><\u002Fdiv><div style=\"padding:11px 13px\"><div style=\"font:600 13px/1.3 var(--f);color:#E7EAF2\">奖励金 gold<\u002Fdiv><div style=\"font:11px/1.5 var(--m);color:#6F7789\">--gold · 金币/会员/稀有<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);overflow:hidden;background:var(--g1);box-shadow:var(--gs1)\"><div style=\"height:64px;background:var(--dia)\"><\u002Fdiv><div style=\"padding:11px 13px\"><div style=\"font:600 13px/1.3 var(--f);color:#E7EAF2\">钻石蓝 diamond<\u002Fdiv><div style=\"font:11px/1.5 var(--m);color:#6F7789\">--dia · 钻石/充值<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);overflow:hidden;background:var(--g1);box-shadow:var(--gs1)\"><div style=\"height:64px;background:var(--coral)\"><\u002Fdiv><div style=\"padding:11px 13px\"><div style=\"font:600 13px/1.3 var(--f);color:#E7EAF2\">珊瑚 coral<\u002Fdiv><div style=\"font:11px/1.5 var(--m);color:#6F7789\">--coral · 未读/危险/互动<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);overflow:hidden;background:var(--g1);box-shadow:var(--gs1)\"><div style=\"height:64px;background:var(--jade)\"><\u002Fdiv><div style=\"padding:11px 13px\"><div style=\"font:600 13px/1.3 var(--f);color:#E7EAF2\">玉 jade<\u002Fdiv><div style=\"font:11px/1.5 var(--m);color:#6F7789\">--jade · 成功/在线/签到<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);overflow:hidden;background:var(--g1);box-shadow:var(--gs1)\"><div style=\"height:64px;background:var(--azure)\"><\u002Fdiv><div style=\"padding:11px 13px\"><div style=\"font:600 13px/1.3 var(--f);color:#E7EAF2\">社交蓝 azure<\u002Fdiv><div style=\"font:11px/1.5 var(--m);color:#6F7789\">--azure · 私信/关系<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);overflow:hidden;background:var(--g1);box-shadow:var(--gs1)\"><div style=\"height:64px;background:var(--violet)\"><\u002Fdiv><div style=\"padding:11px 13px\"><div style=\"font:600 13px/1.3 var(--f);color:#E7EAF2\">创作紫 violet<\u002Fdiv><div style=\"font:11px/1.5 var(--m);color:#6F7789\">--violet · 编辑/工坊/群聊<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);overflow:hidden;background:var(--g1);box-shadow:var(--gs1)\"><div style=\"height:64px;background:var(--rose)\"><\u002Fdiv><div style=\"padding:11px 13px\"><div style=\"font:600 13px/1.3 var(--f);color:#E7EAF2\">收藏玫瑰 rose<\u002Fdiv><div style=\"font:11px/1.5 var(--m);color:#6F7789\">--rose · 喜欢/收藏<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);overflow:hidden;background:var(--g1);box-shadow:var(--gs1)\"><div style=\"height:64px;background:var(--bg)\"><\u002Fdiv><div style=\"padding:11px 13px\"><div style=\"font:600 13px/1.3 var(--f);color:#E7EAF2\">页面底 canvas<\u002Fdiv><div style=\"font:11px/1.5 var(--m);color:#6F7789\">--bg · 光晕承载的最底层<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);overflow:hidden;background:var(--g1);box-shadow:var(--gs1)\"><div style=\"height:64px;background:var(--fin)\"><\u002Fdiv><div style=\"padding:11px 13px\"><div style=\"font:600 13px/1.3 var(--f);color:#E7EAF2\">金融石墨 finance<\u002Fdiv><div style=\"font:11px/1.5 var(--m);color:#6F7789\">--fin · 只用于资产仪表<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"font:600 17px/1 var(--f);color:#E7EAF2;margin:40px 0 14px\">四层材质 — 玻璃的边界在哪里<\u002Fh3>\n  <div style=\"position:relative;border-radius:var(--r-panel);overflow:hidden;background:var(--bg);box-shadow:var(--bezel);padding:28px\">\n    <div style=\"position:absolute;inset:0;background:var(--amb)\"><\u002Fdiv>\n    <div style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\">\n      <div style=\"border-radius:var(--r-card);background:var(--g1);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);box-shadow:var(--gs1);padding:16px\">\n        <div style=\"font:11px/1 var(--m);color:var(--ink3);letter-spacing:.1em\">L1 · CONTENT<\u002Fdiv>\n        <div style=\"font:600 16px/1.4 var(--f);color:var(--ink);margin:8px 0 6px\">承载层玻璃<\u002Fdiv>\n        <div style=\"font:13px/1.65 var(--f);color:var(--ink2)\">列表、表单、正文面。透明度最低（5.5% / 58%），blur 28，发丝边 + 一道内高光 + 短阴影。可读性优先。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:var(--r-card);background:var(--g2);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);box-shadow:var(--gs2);padding:16px\">\n        <div style=\"font:11px/1 var(--m);color:var(--ink3);letter-spacing:.1em\">L2 · RAISED<\u002Fdiv>\n        <div style=\"font:600 16px/1.4 var(--f);color:var(--ink);margin:8px 0 6px\">浮起层玻璃<\u002Fdiv>\n        <div style=\"font:13px/1.65 var(--f);color:var(--ink2)\">Sheet、Modal、气泡菜单、选中卡。更亮、更高阴影，边缘高光更明显；升起位置来自操作源。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:var(--r-card);background:var(--g3);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);box-shadow:var(--gs3);padding:16px\">\n        <div style=\"font:11px/1 var(--m);color:var(--ink3);letter-spacing:.1em\">L3 · CHROME<\u002Fdiv>\n        <div style=\"font:600 16px/1.4 var(--f);color:var(--ink);margin:8px 0 6px\">系统层玻璃<\u002Fdiv>\n        <div style=\"font:13px/1.65 var(--f);color:var(--ink2)\">Dock、导航条、输入岛、工具栏、保存条。跟随内容滚动而变浓；永远不承载正文。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:var(--r-card);background:var(--fin);box-shadow:var(--gs2);padding:16px\">\n        <div style=\"font:11px/1 var(--m);color:rgb(255 255 255/45%);letter-spacing:.1em\">L0 · SOLID<\u002Fdiv>\n        <div style=\"font:600 16px/1.4 var(--f);color:#F5F8FF;margin:8px 0 6px\">不透明实体<\u002Fdiv>\n        <div style=\"font:13px/1.65 var(--f);color:rgb(233 239 255/72%)\">资产仪表、媒体、长文阅读面。玻璃不是万能——需要绝对可读或需要「重量」的地方用实体面。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;margin:18px 0 0;padding:14px 16px;border-radius:var(--r-ctl);background:var(--g1);backdrop-filter:var(--bl-s);-webkit-backdrop-filter:var(--bl-s);box-shadow:var(--gs1);font:13px/1.7 var(--f);color:var(--ink2)\"><strong style=\"color:var(--ink);font-weight:600\">硬规则：<\u002Fstrong>同一对象上只允许一层玻璃 + 一层发丝边 + 一道内高光。禁止叠玻璃、禁止外发光、禁止呼吸光与永久扫光。正文永远不放在两层玻璃之上。<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin:40px 0 0\">\n    <div>\n      <h3 style=\"font:600 17px/1 var(--f);color:#E7EAF2;margin:0 0 14px\">字号阶梯（微软雅黑 / PingFang SC）<\u002Fh3>\n      <div style=\"border-radius:var(--r-card);background:rgb(255 255 255/4%);box-shadow:inset 0 0 0 1px rgb(255 255 255/8%);padding:6px 18px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgb(255 255 255/7%)\"><span style=\"font:700 34px/1.1 var(--f);color:#F4F6FB;letter-spacing:-.02em\">大标题<\u002Fspan><code style=\"font:11px var(--m);color:#6F7789\">34 / 700 / -2%<\u002Fcode><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgb(255 255 255/7%)\"><span style=\"font:600 28px/1.15 var(--f);color:#F4F6FB\">展示标题<\u002Fspan><code style=\"font:11px var(--m);color:#6F7789\">28 / 600<\u002Fcode><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgb(255 255 255/7%)\"><span style=\"font:600 22px/1.2 var(--f);color:#F4F6FB\">页面标题<\u002Fspan><code style=\"font:11px var(--m);color:#6F7789\">22 / 600<\u002Fcode><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgb(255 255 255/7%)\"><span style=\"font:600 17px/1.3 var(--f);color:#F4F6FB\">分区标题<\u002Fspan><code style=\"font:11px var(--m);color:#6F7789\">17 / 600<\u002Fcode><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgb(255 255 255/7%)\"><span style=\"font:15px/1.6 var(--f);color:#C6CBD8\">正文 15px，行高 1.6，中文长句优先换行不缩字号<\u002Fspan><code style=\"font:11px var(--m);color:#6F7789\">15 / 400<\u002Fcode><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgb(255 255 255/7%)\"><span style=\"font:13px/1.5 var(--f);color:#8B93A6\">元数据 13px · 时间 · 计数 · 说明<\u002Fspan><code style=\"font:11px var(--m);color:#6F7789\">13 / 400<\u002Fcode><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0\"><span style=\"font:19px/1.9 var(--serif);color:#C6CBD8\">叙事阅读面用中文衬线，仅限小说与剧场正文<\u002Fspan><code style=\"font:11px var(--m);color:#6F7789\">19 / serif<\u002Fcode><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h3 style=\"font:600 17px/1 var(--f);color:#E7EAF2;margin:0 0 14px\">几何、间距与安全区<\u002Fh3>\n      <div style=\"border-radius:var(--r-card);background:rgb(255 255 255/4%);box-shadow:inset 0 0 0 1px rgb(255 255 255/8%);padding:18px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;gap:12px;align-items:flex-end\">\n          <div style=\"width:52px;height:52px;border-radius:var(--r-ctl);background:rgb(255 255 255/8%);box-shadow:inset 0 0 0 1px rgb(255 255 255/12%)\"><\u002Fdiv>\n          <div style=\"width:58px;height:58px;border-radius:var(--r-row);background:rgb(255 255 255/8%);box-shadow:inset 0 0 0 1px rgb(255 255 255/12%)\"><\u002Fdiv>\n          <div style=\"width:64px;height:6  minmax(0,1fr);font:13px/1.65 var(--f);color:#A8B0C2;padding:13px 16px;border-top:1px solid rgb(255 255 255/7%)\"><span style=\"color:#E7EAF2;font-weight:600\">页面 push / pop<\u002Fspan><span>与导航方向一致的短位移 + 淡入（View Transitions）<\u002Fspan><span><code style=\"font:12px var(--m)\">220–460ms<\u002Fcode><\u002Fspan><span>返回不能像前进；未知路由不猜方向<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1.25fr) 120px minmax(0,1fr);font:13px/1.65 var(--f);color:#A8B0C2;padding:13px 16px;border-top:1px solid rgb(255 255 255/7%)\"><span style=\"color:#E7EAF2;font-weight:600\">发现 → 详情 → 对话<\u002Fspan><span>人物媒体共享连续性，玻璃控件先退场再由新层接管<\u002Fspan><span><code style=\"font:12px var(--m)\">440–720ms<\u002Fcode><\u002Fspan><span>只做一次；不延迟内容可用性<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1.25fr) 120px minmax(0,1fr);font:13px/1.65 var(--f);color:#A8B0C2;padding:13px 16px;border-top:1px solid rgb(255 255 255/7%)\"><span style=\"color:#E7EAF2;font-weight:600\">Sheet / Modal 打开<\u002Fspan><span>从操作源附近升起并稳定落位，背景玻璃加浓<\u002Fspan><span><code style=\"font:12px var(--m)\">≈380ms<\u002Fcode><\u002Fspan><span>打开即转移焦点，关闭归还焦点<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1.25fr) 120px minmax(0,1fr);font:13px/1.65 var(--f);color:#A8B0C2;padding:13px 16px;border-top:1px solid rgb(255 255 255/7%)\"><span style=\"color:#E7EAF2;font-weight:600\">新消息 / 新项目<\u002Fspan><span>沿列表或轨道方向进入<\u002Fspan><span><code style=\"font:12px var(--m)\">300–420ms<\u002Fcode><\u002Fspan><span>历史内容首次挂载不逐条表演<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1.25fr) 120px minmax(0,1fr);font:13px/1.65 var(--f);color:#A8B0C2;padding:13px 16px;border-top:1px solid rgb(255 255 255/7%)\"><span style=\"color:#E7EAF2;font-weight:600\">下拉刷新<\u002Fspan><span>高度、阻尼、图标角度跟手，释放回弹<\u002Fspan><span>跟手 / 回弹 <code style=\"font:12px var(--m)\">260ms<\u002Fcode><\u002Fspan><span>横向轨道不误触；touchcancel 不提交<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1.25fr) 120px minmax(0,1fr);font:13px/1.65 var(--f);color:#A8B0C2;padding:13px 16px;border-top:1px solid rgb(255 255 255/7%)\"><span style=\"color:#E7EAF2;font-weight:600\">资产 / SVIP 实体出现<\u002Fspan><span>轻微落位 + 一次材质光线通过<\u002Fspan><span><code style=\"font:12px var(--m)\">540–820ms<\u002Fcode><\u002Fspan><span>不循环扫光；不挡金额与 CTA<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1.25fr) 120px minmax(0,1fr);font:13px/1.65 var(--f);color:#A8B0C2;padding:13px 16px;border-top:1px solid rgb(255 255 255/7%)\"><span style=\"color:#E7EAF2;font-weight:600\">Tab 横滑<\u002Fspan><span>四个一级页按索引方向跟手位移<\u002Fspan><span>跟手<\u002Fspan><span>与横向轨道 / 侧滑返回冲突时让位<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1.25fr) 120px minmax(0,1fr);font:13px/1.65 var(--f);color:#A8B0C2;padding:13px 16px;border-top:1px solid rgb(255 255 255/7%)\"><span style=\"color:#E7EAF2;font-weight:600\">保存 / 发送 / 签到<\u002Fspan><span>原位 loading → 明确成功或错误<\u002Fspan><span>状态驱动<\u002Fspan><span>防重复提交；失败不伪装成功<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font:13px/1.8 var(--f);color:#8B93A6;margin:18px 0 0;max-width:96ch\">缓动统一 <code style=\"font:12px var(--m);color:#C6CBD8\">cubic-bezier(.2,.8,.2,1)<\u002Fcode>。<code style=\"font:12px var(--m);color:#C6CBD8\">prefers-reduced-motion<\u002Fcode> 下取消位移、缩放、视差与非必要过渡，只保留最简状态反馈；<code style=\"font:12px var(--m);color:#C6CBD8\">lite<\u002Fcode> 档额外关闭全部 backdrop-filter，玻璃回落为不透明分组底，层级与对比度不变。<\u002Fp>\n<\u002Fsection>\n\n<section id=\"gA\" style=\"padding:44px 0 8px\">\n  <div style=\"display:flex;align-items:baseline;gap:14px;padding-bottom:22px;border-bottom:1px solid rgb(255 255 255/9%)\">\n    <h2 style=\"font:700 30px/1.1 var(--f);margin:0;color:#F4F6FB\">04 一级目的地与创建<\u002Fh2>\n    <span style=\"font:13px/1 var(--m);color:#6F7789\">原型 1 编排式首页 · 原型 2 沉浸媒体 · 原型 3 索引列表 · 原型 5 身份<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"font:14px/1.75 var(--f);color:#8B93A6;margin:18px 0 26px;max-width:96ch\">Dock 里只有四个目的地，创建是 Dock 的同级动作而非第五个 Tab。四个一级页各自成立：今日是编排、发现是沉浸、消息是索引、我的是陈列 —— 不共享同一张卡片模板。下面每屏的 Dock 可点击，直接跳到对应屏。<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;gap:40px 30px;zoom:var(--zoom)\">\n\n    <div style=\"display:flex;flex-direction:column;gap:9px;width:390px\">\n      <div style=\"display:flex;align-items:baseline;gap:9px\"><span style=\"font:600 14px/1 var(--f);color:#E7EAF2\">01 今日<\u002Fspan><code style=\"font:11px var(--m);color:#6F7789\">/today<\u002Fcode><\u002Fdiv>\n      <div id=\"s01\" style=\"position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg);box-shadow:var(--bezel)\">\n        <div style=\"position:absolute;inset:0;background:var(--amb)\"><\u002Fdiv>\n        <div style=\"position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#07080C;z-index:9\"><\u002Fdiv>\n        <div style=\"position:relative;height:54px;display:flex;align-items:center;justify-content:space-between;padding:16px 26px 0;color:var(--ink);font:600 14px/1 var(--f)\"><span>9:41<\u002Fspan><span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:15px;height:10px;border-radius:2px;background:currentColor;opacity:.9\"><\u002Fspan><span style=\"width:22px;height:11px;border-radius:3px;box-shadow:inset 0 0 0 1.2px currentColor;opacity:.7\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"position:absolute;top:54px;left:0;right:0;bottom:0;padding:14px 16px 0;overflow:hidden\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n            <div><div style=\"font:13px/1 var(--f);color:var(--ink3)\">7月26日 星期日<\u002Fdiv><div style=\"font:700 34px/1.15 var(--f);color:var(--ink);letter-spacing:-.02em;margin-top:6px\">今日<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:cen -shadow:inset 0 0 0 1px var(--line);font:12px/1.7 var(--f);color:var(--ink3)\">对照规则：编辑器载入失败时同屏出现，但<strong style=\"color:var(--ink2);font-weight:600\">绝不渲染可保存的空表单<\u002Fstrong>；剧场载入失败保留旁观入口。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:11px/1.7 var(--m);color:#6F7789\">RouteErrorBoundary.jsx · 错误说人话 + 错误码小字；重试恢复同一任务。5xx/断网不清登录，只有 401/403 走认证。<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:9px;width:390px\">\n      <div style=\"display:flex;align-items:baseline;gap:9px\"><span style=\"font:600 14px/1 var(--f);color:#E7EAF2\">49 危险确认<\u002Fspan><code style=\"font:11px var(--m);color:#6F7789\">alertdialog · 焦点锁<\u002Fcode><\u002Fdiv>\n      <div id=\"s49\" style=\"position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg);box-shadow:var(--bezel)\">\n        <div style=\"position:absolute;inset:0;background:var(--amb);filter:blur(2px)\"><\u002Fdiv>\n        <div style=\"position:absolute;top:54px;left:16px;right:16px;opacity:.45;filter:blur(3px)\"><div style=\"font:700 34px/1.15 var(--f);color:var(--ink)\">设置<\u002Fdiv><div style=\"height:180px;border-radius:var(--r-card);background:var(--g1);margin-top:16px\"><\u002Fdiv><div style=\"height:120px;border-radius:var(--r-card);background:var(--g1);margin-top:12px\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"position:absolute;inset:0;background:rgb(6 8 14/48%)\"><\u002Fdiv>\n        <div style=\"position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#07080C;z-index:9\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;border-radius:var(--r-sheet) var(--r-sheet) 0 0;background:var(--g2);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);box-shadow:var(--gs2);padding:10px 16px 30px\">\n          <div style=\"width:38px;height:5px;border-radius:3px;background:var(--ink3);opacity:.45;margin:0 auto 16px\"><\u002Fdiv>\n          <div style=\"fon 0 1px var(--line),0 -6px 20px rgb(0 0 0/25%);z-index:8\">\n          <div style=\"flex:1;display:flex;justify-content:space-around\">\n            <a href=\"#s01\" style=\"display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;padding:5px 0;color:var(--act)\"><span style=\"width:19px;height:19px;border-radius:5px;box-shadow:inset 0 0 0 2px currentColor\"><\u002Fspan><span style=\"font:600 10px/1 var(--f)\">今日<\u002Fspan><\u002Fa>\n            <a href=\"#s02\" style=\"display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;padding:5px 0;color:var(--ink3)\"><span style=\"width:19px;height:19px;border-radius:50%;box-shadow:inset 0 0 0 2px currentColor\"><\u002Fspan><span style=\"font:10px/1 var(--f)\">发现<\u002Fspan><\u002Fa>\n            <a href=\"#s03\" style=\"display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;padding:5px 0;color:var(--ink3)\"><span style=\"width:19px;height:17px;border-radius:6px 6px 6px 2px;box-shadow:inset 0 0 0 2px currentColor\"><\u002Fspan><span style=\"font:10px/1 var(--f)\">消息<\u002Fspan><\u002Fa>\n            <a href=\"#s04\" style=\"display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;padding:5px 0;color:var(--ink3)\"><span style=\"width:19px;height:19px;border-radius:50%;box-shadow:inset 0 0 0 2px currentColor\"><\u002Fspan><span style=\"font:10px/1 var(--f)\">我的<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n          <a href=\"#s05\" style=\"width:50px;height:50px;border-radius:50%;background:var(--act);color:var(--act-ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto\"><span style=\"width:18px;height:2.2px;background:currentColor;position:relative;border-radius:2px\"><span style=\"position:absolute;left:7.9px;top:-7.9px;width:2.2px;height:18px;background:currentColor;border-radius:2px\"><\u002Fspan><\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:11px/1.7 var(--m);color:#6F7789\">perf.js · lite 是等价模式不是残缺皮肤。右上 Tweaks 面板切 perf=lite 可全局预览此效果。<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"handoff\" style=\"padding:44px 0 20px\">\n  <div style=\"display:flex;align-items:baseline;gap:14px;padding-bottom:22px;border-bottom:1px solid rgb(255 255 255/9%)\">\n    <h2 style=\"font:700 30px/1.1 var(--f);margin:0;color:#F4F6FB\">12 交接给 Claude Code<\u002Fh2>\n    <span style=\"font:13px/1 var(--m);color:#6F7789\">三份文件 · 复制即用<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:26px\">\n    <div style=\"border-radius:var(--r-card);background:rgb(255 255 255/4%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%);padding:20px\">\n      <div style=\"font:11px/1 var(--m);color:#6F7789;letter-spacing:.1em\">TOKENS<\u002Fdiv>\n      <div style=\"font:600 16px/1.4 var(--f);color:#F4F6FB;margin:10px 0 8px\">lumen-glass-tokens.css<\u002Fdiv>\n      <div style=\"font:13px/1.7 var(--f);color:#A8B0C2\">全部 --lg-* 语义令牌（浅/深/强调色/lite），与本稿渲染值一字不差。放入 client/src/styles/，替代 app-quiet-aqua-tokens.css 的角色。<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);background:rgb(255 255 255/4%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%);padding:20px\">\n      <div style=\"font:11px/1 var(--m);color:#6F7789;letter-spacing:.1em\">SPEC<\u002Fdiv>\n      <div style=\"font:600 16px/1.4 var(--f);color:#F4F6FB;margin:10px 0 8px\">LUMEN_GLASS_SPEC.md<\u002Fdiv>\n      <div style=\"font:13px/1.7 var(--f);color:#A8B0C2\">设计权威文档：材质四层、组件契约、状态矩阵、动效表、逐屏实施说明（每屏对应的仓库文件与改动点）。<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-radius:var(--r-card);background:rgb(255 255 255/4%);box-shadow:inset 0 0 0 1px rgb(255 255 255/9%);padding:20px\">\n      <div style=\"font:11px/1 var(--m);color:#6F7789;letter-spacing:.1em\">PROMPT<\u002Fdiv>\n      <div style=\"font:600 16px/1.4 var(--f);color:#F4F6FB;margin:10px 0 8px\">CLAUDE_CODE_PROMPT.md<\u002Fdiv>\n      <div style=\"font:13px/1.7 var(--f);color:#A8B0C2\">给 Claude Code 网页版的实施指令：分 6 个 PR 的落地顺序、验收命令、硬约束。整段复制进对话框即可开工。<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;iris&quot;,&quot;azure&quot;,&quot;violet&quot;,&quot;jade&quot;,&quot;clay&quot;],&quot;default&quot;:&quot;iris&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;perf&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;balanced&quot;,&quot;lite&quot;],&quot;default&quot;:&quot;balanced&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;降级&quot;},&quot;zoom&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;降级&quot;}}\">\nclass Component extends DCLogic {\n  state = { theme: null };\n  get theme() { return this.state.theme || this.props.theme || 'dark'; }\n  apply() {\n    const r = document.documentElement;\n    r.dataset.lgTheme = this.theme;\n    r.dataset.lgAccent = this.props.accent || 'iris';\n    r.dataset.lgPerf = this.props.perf || 'balanced';\n    r.style.setProperty('--zoom', String(this.props.zoom ?? 1));\n  }\n  componentDidMount() { this.apply(); }\n  componentDidUpdate() { this.apply(); }\n  renderVals() {\n    const on = 'rgb(255 255 255/16%)', off = 'rgb(255 255 255/5%)';\n    return {\n      setDark: () => this.setState({ theme: 'dark' }),\n      setLight: () => this.setState({ theme: 'light' }),\n      darkBtn: this.theme === 'dark' ? on : off,\n      lightBtn: this.theme === 'light' ? on : off,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
