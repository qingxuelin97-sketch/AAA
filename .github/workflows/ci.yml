name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "claude/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Build static app bundle
        run: npm run build:static

      - name: Security regression
        run: npm run test:sec

      - name: Payment regression
        run: npm run test:payments

      - name: Play Integrity regression
        run: npm run test:integrity

      - name: Safe outbound URL regression
        run: npm run test:safe-url

      - name: App invariants
        run: npm run test:app

      - name: Web invariants
        run: npm run test:web

      # —— 直接守钱的回归 ——
      # 这五个测试此前全都写好了却从不运行。转盘反向印钞（付费转期望回收
      # 174.31 金 / 售价 100 金）就是在这个空档里长出来的：奖池怎么改都没人拦。
      # 全部合计约 12 秒。
      - name: Economy regression (wheel / gift / fees / milestones)
        run: |
          npm run test:gacha
          npm run test:gift
          npm run test:theater-fee
          npm run test:once-fee
          npm run test:milestone

      # —— 其余已写好但同样从不运行的回归 ——
      # 合计约 20 秒。「测试存在但不跑」和「没有测试」的防护力完全相同，
      # 区别只是前者让人误以为有防护。
      - name: Feature regression (boundaries / logs / social / recall / novels)
        run: |
          npm run smoke
          npm run test:wb-vars
          npm run test:regen
          npm run test:worldbook
          npm run test:ctx
          npm run test:logic
          npm run test:server:s7
          npm run test:logs
          npm run test:hearts
          npm run test:inbox
          npm run test:frame
          npm run test:recall
          npm run test:novels:mock

      # configure-android.mjs 掌管整条发版链路，且反馈环最长——改错要等到出完 APK、
      # 装到真机上才发现，而那时错的可能是「装得上但注册不了」这种不报错的形态。
      - name: Release-chain regression
        run: node scripts/configure-android.test.mjs

      # 注：npm run reg-flow 目前有 7 项既有失败（注册/业务日志相关，早于本次改动，
      # 已在 e33880f 上复现为同样的 32 passed / 7 failed），修好之前不挂硬闸。
