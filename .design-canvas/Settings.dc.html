<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
  :root{
    --canvas:#EFF8FD; --surface:#FFFFFF; --grouped:#E3F1FA;
    --ink:#0A1330; --ink2:#44557A; --ink3:#58677F;
    --act:#0B72B0; --focus:#064766;
    --hair:rgb(20 70 110 / 10%); --hair2:rgb(20 70 110 / 18%);
    --rk:12px; --rc:16px; --rp:22px;
    --grad:linear-gradient(135deg,#38DAD2 0%,#2E9FF7 100%);
    --violet-w:#EBE7FD; --violet-i:#6D4AD8;
    --indigo-w:#E3E8FC; --indigo-i:#3B57D6;
    --coral-w:#FFEBE3;  --coral-i:#B44B1D;
    --amber-w:#FDF1DC;  --amber-i:#8A600A;
    --mint-w:#DDF5EC;   --mint-i:#0B7C50;
    --rose-w:#FDE7EE;   --rose-i:#BF365F;
    --cyan-w:#DEF5FD;   --cyan-i:#0B72B0;
    --sans:"Inter Variable","Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--canvas);color:var(--ink);
       -webkit-font-smoothing:antialiased}
  a{color:var(--act)} a:hover{color:var(--focus)}
  .scr{width:390px;min-height:844px;background:linear-gradient(180deg,#EFF8FD 0%,#F3FBFE 60%,#EDF7FD 100%);padding:0 16px 96px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 0 14px}
  .h1{font-size:34px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
  .kick{font-size:13px;color:var(--ink2);margin:0 0 2px}
  .card{background:var(--surface);border-radius:var(--rc);padding:14px;
        box-shadow:0 1px 2px rgb(20 70 110 / 6%)}
  .sect{font-size:13px;color:var(--ink2);margin:22px 0 8px;font-weight:500}
  .chip{width:38px;height:38px;border-radius:var(--rk);display:grid;place-items:center;flex:none;
        box-shadow:inset 0 0 0 1px color-mix(in oklab,currentColor 16%,transparent)}
  .chip.sm{width:34px;height:34px}
  .row{display:flex;align-items:center;gap:12px;min-height:60px}
  .row b{font-size:15px;font-weight:600;display:block;line-height:1.35}
  .row small{font-size:13px;color:var(--ink2);display:block;line-height:1.35}
  .grow{flex:1;min-width:0}
  .chev{color:var(--ink3);flex:none}
  .divider{height:1px;background:var(--hair);margin:0 0 0 46px}

  </style>
</helmet>

<div class="scr">
  <div style="display:flex;align-items:center;gap:8px;padding:20px 0 16px">
    <span style="color:var(--ink2)"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l-5 5 5 5"/></svg></span>
    <h2 style="flex:1;text-align:center;margin:0 34px 0 0;font-size:22px;font-weight:700">设置与通知</h2>
  </div>
  <div class="card" style="padding:0">
    <div class="row" style="padding:0 14px"><span class="chip sm" style="background:var(--coral-w);color:var(--coral-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a4 4 0 1 1 8 0c0 3 1 4 1.5 4.5h-11C5 12.5 6 11.5 6 8.5z"/><path d="M8.6 16a1.6 1.6 0 0 0 2.8 0"/></svg></span>
      <span class="grow"><b>2 条新通知</b><small>查看尚未读过的互动与系统消息</small></span>
      <span style="background:#9E1B32;color:#fff;font-size:12px;font-weight:600;border-radius:999px;
                   min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px">2</span>
      <span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span></div>
  </div>
  <p class="sect">智能能力</p><div class="card" style="padding:0"><div class="row" style="padding:0 14px"><span class="chip sm" style="background:var(--violet-w);color:var(--violet-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="8" height="8" rx="1.6"/><path d="M8 3v3M12 3v3M8 14v3M12 14v3M3 8h3M3 12h3M14 8h3M14 12h3"/></svg></span><span class="grow"><b>语言模型</b><small>服务商、模型与生成参数</small></span><span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span></div><div class="divider"></div><div class="row" style="padding:0 14px"><span class="chip sm" style="background:var(--indigo-w);color:var(--indigo-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h2.5L11 5v10L7.5 12H5z"/><path d="M13.5 8.2a2.6 2.6 0 0 1 0 3.6"/></svg></span><span class="grow"><b>语音模型</b><small>朗读服务、音色与试听</small></span><span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span></div></div>
  <p class="sect">账号与隐私</p><div class="card" style="padding:0"><div class="row" style="padding:0 14px"><span class="chip sm" style="background:var(--indigo-w);color:var(--indigo-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5l5 2v4.5c0 3.2-2.1 5.4-5 6.5-2.9-1.1-5-3.3-5-6.5V5.5z"/><path d="M7.8 10l1.6 1.6 3-3.2"/></svg></span><span class="grow"><b>账号安全</b><small>个人资料与登录密码</small></span><span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span></div><div class="divider"></div><div class="row" style="padding:0 14px"><span class="chip sm" style="background:var(--rose-w);color:var(--rose-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="10" height="7" rx="1.8"/><path d="M7.5 9V7a2.5 2.5 0 0 1 5 0v2"/></svg></span><span class="grow"><b>隐私</b><small>可见范围、消息与数据管理</small></span><span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span></div></div>
  <p class="sect">显示与支持</p><div class="card" style="padding:0"><div class="row" style="padding:0 14px"><span class="chip sm" style="background:var(--amber-w);color:var(--amber-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h12M4 13.5h12"/><circle cx="8" cy="6.5" r="1.8"/><circle cx="13" cy="13.5" r="1.8"/></svg></span><span class="grow"><b>偏好</b><small>主题、色彩、性能与通知</small></span><span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span></div><div class="divider"></div><div class="row" style="padding:0 14px"><span class="chip sm" style="background:var(--coral-w);color:var(--coral-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="2.6"/><path d="M5.4 5.4l2.7 2.7M14.6 5.4l-2.7 2.7M5.4 14.6l2.7-2.7M14.6 14.6l-2.7-2.7"/></svg></span><span class="grow"><b>帮助中心</b><small>使用指引、产品功能与条款</small></span><span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span></div></div>
</div>
</x-dc>
</body>
</html>
