<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
  :root{
    --canvas:#EFF8FD; --surface:#FFFFFF; --grouped:#E3F1FA;
    --ink:#0A1330; --ink2:#44557A; --ink3:#58677F;
    --act:#0B72B0; --focus:#064766;
    --hair:rgb(20 70 110 / 10%); --hair2:rgb(20 70 110 / 18%);
    --rk:12px; --rc:16px; --rp:22px;
    --grad:linear-gradient(135deg,#38DAD2 0%,#2E9FF7 100%);
    --violet-w:#EBE7FD; --violet-i:#6D4AD8;
    --indigo-w:#E3E8FC; --indigo-i:#3B57D6;
    --coral-w:#FFEBE3;  --coral-i:#B44B1D;
    --amber-w:#FDF1DC;  --amber-i:#8A600A;
    --mint-w:#DDF5EC;   --mint-i:#0B7C50;
    --rose-w:#FDE7EE;   --rose-i:#BF365F;
    --cyan-w:#DEF5FD;   --cyan-i:#0B72B0;
    --sans:"Inter Variable","Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--canvas);color:var(--ink);
       -webkit-font-smoothing:antialiased}
  a{color:var(--act)} a:hover{color:var(--focus)}
  .scr{width:390px;min-height:844px;background:linear-gradient(180deg,#EFF8FD 0%,#F3FBFE 60%,#EDF7FD 100%);padding:0 16px 96px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 0 14px}
  .h1{font-size:34px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
  .kick{font-size:13px;color:var(--ink2);margin:0 0 2px}
  .card{background:var(--surface);border-radius:var(--rc);padding:14px;
        box-shadow:0 1px 2px rgb(20 70 110 / 6%)}
  .sect{font-size:13px;color:var(--ink2);margin:22px 0 8px;font-weight:500}
  .chip{width:38px;height:38px;border-radius:var(--rk);display:grid;place-items:center;flex:none;
        box-shadow:inset 0 0 0 1px color-mix(in oklab,currentColor 16%,transparent)}
  .chip.sm{width:34px;height:34px}
  .row{display:flex;align-items:center;gap:12px;min-height:60px}
  .row b{font-size:15px;font-weight:600;display:block;line-height:1.35}
  .row small{font-size:13px;color:var(--ink2);display:block;line-height:1.35}
  .grow{flex:1;min-width:0}
  .chev{color:var(--ink3);flex:none}
  .divider{height:1px;background:var(--hair);margin:0 0 0 46px}

  </style>
</helmet>

<div class="scr">
  <div style="display:flex;justify-content:flex-end;gap:16px;padding:18px 0 10px;color:var(--ink2)"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a4 4 0 1 1 8 0c0 3 1 4 1.5 4.5h-11C5 12.5 6 11.5 6 8.5z"/><path d="M8.6 16a1.6 1.6 0 0 0 2.8 0"/></svg><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h12M4 13.5h12"/><circle cx="8" cy="6.5" r="1.8"/><circle cx="13" cy="13.5" r="1.8"/></svg></div>
  <div style="display:flex;align-items:center;gap:14px">
    <span style="width:76px;height:76px;border-radius:20px;background:linear-gradient(150deg,#C9D6DF,#9FB3C0);
                 box-shadow:0 0 0 3px #fff,0 2px 10px rgb(20 70 110 / 14%);flex:none"></span>
    <span class="grow"><b style="font-size:26px;font-weight:700;display:block">旅人</b>
      <small style="font-size:13px;color:var(--ink2)">UID: U1</small></span>
  </div>
  <p style="font-size:13px;color:var(--ink2);margin:14px 0 10px;line-height:1.6">幻域官方认证 · 平台超级管理员 | SVIP 尊享会员</p>
  <div class="card" style="display:flex;padding:14px 8px"><div style="flex:1;text-align:center"><b style="font-size:19px;font-weight:700">3</b><div style="font-size:12px;color:var(--ink2);margin-top:2px">角色</div></div><div style="flex:1;text-align:center"><b style="font-size:19px;font-weight:700">1</b><div style="font-size:12px;color:var(--ink2);margin-top:2px">剧本</div></div><div style="flex:1;text-align:center"><b style="font-size:19px;font-weight:700">3</b><div style="font-size:12px;color:var(--ink2);margin-top:2px">粉丝</div></div><div style="flex:1;text-align:center"><b style="font-size:19px;font-weight:700">3</b><div style="font-size:12px;color:var(--ink2);margin-top:2px">关注</div></div></div>
  <div style="background:linear-gradient(120deg,#F0BE5C,#E0973A);border-radius:var(--rc);padding:14px;
              margin-top:12px;display:flex;align-items:center;gap:12px">
    <span class="chip" style="background:rgb(255 255 255 / 78%);color:#8A600A;box-shadow:none"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="12" r="4"/><path d="M7 3l2 5M13 3l-2 5"/></svg></span>
    <span class="grow" style="color:#3C2A05"><b style="font-size:16px;font-weight:700;display:block">SVIP 尊享会员</b>
      <small style="font-size:12px;opacity:.8">平台 AI 5 折 · 至高权益</small></span>
    <span style="background:#fff;color:#8A600A;border-radius:999px;min-height:36px;display:grid;place-items:center;
                 padding:0 16px;font-size:13px;font-weight:600">查看</span>
  </div>
  <div style="background:var(--grad);border-radius:var(--rc);padding:14px;margin-top:12px;color:#fff">
    <div style="display:flex;align-items:baseline;gap:8px">
      <b style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums">18,600</b>
      <span style="font-size:12px;opacity:.8">金币</span>
      <b style="font-size:24px;font-weight:700;margin-left:10px;font-variant-numeric:tabular-nums">320</b>
      <span style="font-size:12px;opacity:.8">钻石</span></div>
    <div style="background:rgb(255 255 255 / 18%);border-radius:999px;margin-top:12px;min-height:44px;
                display:grid;place-items:center;font-size:14px;font-weight:600">钱包 · 签到 / 兑换 / 流水</div>
  </div>
  <div style="display:flex;justify-content:space-between;margin-top:18px"><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--amber-w);color:var(--amber-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="12" r="4"/><path d="M7 3l2 5M13 3l-2 5"/></svg></span><span style="font-size:12px;color:var(--ink2)">成就</span></div><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--violet-w);color:var(--violet-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3"/><ellipse cx="10" cy="10" rx="7.5" ry="3.4" transform="rotate(-25 10 10)"/></svg></span><span style="font-size:12px;color:var(--ink2)">星轨</span></div><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--coral-w);color:var(--coral-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l4.5-11L14 12.5z"/><path d="M13 4.5v2M16.5 7l1.5-1M15 11h2.5"/></svg></span><span style="font-size:12px;color:var(--ink2)">活动</span></div><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--amber-w);color:var(--amber-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9A1.5 1.5 0 0 1 16 5.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 4 14.5z"/><circle cx="7.5" cy="7.5" r=".9"/><circle cx="12.5" cy="12.5" r=".9"/></svg></span><span style="font-size:12px;color:var(--ink2)">幸运转盘</span></div><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--rose-w);color:var(--rose-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16s-5.5-3.4-5.5-7A3 3 0 0 1 10 7.2 3 3 0 0 1 15.5 9c0 3.6-5.5 7-5.5 7z"/></svg></span><span style="font-size:12px;color:var(--ink2)">收藏</span></div></div>
</div>
</x-dc>
</body>
</html>
