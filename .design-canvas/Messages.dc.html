<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
  :root{
    --canvas:#EFF8FD; --surface:#FFFFFF; --grouped:#E3F1FA;
    --ink:#0A1330; --ink2:#44557A; --ink3:#58677F;
    --act:#0B72B0; --focus:#064766;
    --hair:rgb(20 70 110 / 10%); --hair2:rgb(20 70 110 / 18%);
    --rk:12px; --rc:16px; --rp:22px;
    --grad:linear-gradient(135deg,#38DAD2 0%,#2E9FF7 100%);
    --violet-w:#EBE7FD; --violet-i:#6D4AD8;
    --indigo-w:#E3E8FC; --indigo-i:#3B57D6;
    --coral-w:#FFEBE3;  --coral-i:#B44B1D;
    --amber-w:#FDF1DC;  --amber-i:#8A600A;
    --mint-w:#DDF5EC;   --mint-i:#0B7C50;
    --rose-w:#FDE7EE;   --rose-i:#BF365F;
    --cyan-w:#DEF5FD;   --cyan-i:#0B72B0;
    --sans:"Inter Variable","Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--canvas);color:var(--ink);
       -webkit-font-smoothing:antialiased}
  a{color:var(--act)} a:hover{color:var(--focus)}
  .scr{width:390px;min-height:844px;background:linear-gradient(180deg,#EFF8FD 0%,#F3FBFE 60%,#EDF7FD 100%);padding:0 16px 96px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 0 14px}
  .h1{font-size:34px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
  .kick{font-size:13px;color:var(--ink2);margin:0 0 2px}
  .card{background:var(--surface);border-radius:var(--rc);padding:14px;
        box-shadow:0 1px 2px rgb(20 70 110 / 6%)}
  .sect{font-size:13px;color:var(--ink2);margin:22px 0 8px;font-weight:500}
  .chip{width:38px;height:38px;border-radius:var(--rk);display:grid;place-items:center;flex:none;
        box-shadow:inset 0 0 0 1px color-mix(in oklab,currentColor 16%,transparent)}
  .chip.sm{width:34px;height:34px}
  .row{display:flex;align-items:center;gap:12px;min-height:60px}
  .row b{font-size:15px;font-weight:600;display:block;line-height:1.35}
  .row small{font-size:13px;color:var(--ink2);display:block;line-height:1.35}
  .grow{flex:1;min-width:0}
  .chev{color:var(--ink3);flex:none}
  .divider{height:1px;background:var(--hair);margin:0 0 0 46px}

  </style>
</helmet>

<div class="scr">
  <div class="top"><h1 class="h1" style="font-size:30px">消息</h1>
    <span style="color:var(--ink2);padding-bottom:8px"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5"/><path d="M13 13l3.5 3.5"/></svg></span></div>
  <div style="display:flex;background:var(--grouped);border-radius:999px;padding:4px;margin-bottom:14px">
    <span style="flex:1;text-align:center;padding:9px 0;border-radius:999px;background:#fff;color:var(--act);
                 font-size:14px;font-weight:600">聊过</span>
    <span style="flex:1;text-align:center;padding:9px 0;font-size:14px;color:var(--ink2)">收藏</span>
    <span style="flex:1;text-align:center;padding:9px 0;font-size:14px;color:var(--ink2)">收件箱</span>
  </div>
  <div class="card" style="padding:0"><div class="row" style="padding:0 14px"><span class="chip sm" style="background:var(--coral-w);color:var(--coral-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a4 4 0 1 1 8 0c0 3 1 4 1.5 4.5h-11C5 12.5 6 11.5 6 8.5z"/><path d="M8.6 16a1.6 1.6 0 0 0 2.8 0"/></svg></span><span class="grow"><b>互动消息</b><small>2 条新的赞 · 评论 · 关注</small></span><span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span></div><div class="divider"></div><div class="row" style="padding:0 14px"><span class="chip sm" style="background:var(--mint-w);color:var(--mint-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h7A2.5 2.5 0 0 1 16 6.5v4A2.5 2.5 0 0 1 13.5 13H8l-4 3z"/></svg></span><span class="grow"><b>好友私信</b><small>2 条未读私信</small></span><span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span></div><div class="divider"></div><div class="row" style="padding:0 14px"><span class="chip sm" style="background:var(--indigo-w);color:var(--indigo-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="2.8"/><path d="M3.5 16c0-2.4 2-4 4.5-4s4.5 1.6 4.5 4"/><path d="M14 12.4c1.6.5 2.5 1.8 2.5 3.6"/></svg></span><span class="grow"><b>群聊房间</b><small>你加入的群聊更新</small></span><span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span></div></div>
  <p class="sect">与角色的对话</p>
  <div class="card" style="padding:0">
    <div class="row" style="padding:10px 14px;min-height:68px">
      <span style="width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,#33414D,#5A6E7A);flex:none"></span>
      <span class="grow"><b>森灵 · 薇尔</b><small style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">*薇尔的眼中闪过一丝了然，藤蔓温…</small></span>
      <span style="font-size:12px;color:var(--ink3)">00:00</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
