<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
  :root{
    --canvas:#EFF8FD; --surface:#FFFFFF; --grouped:#E3F1FA;
    --ink:#0A1330; --ink2:#44557A; --ink3:#58677F;
    --act:#0B72B0; --focus:#064766;
    --hair:rgb(20 70 110 / 10%); --hair2:rgb(20 70 110 / 18%);
    --rk:12px; --rc:16px; --rp:22px;
    --grad:linear-gradient(135deg,#38DAD2 0%,#2E9FF7 100%);
    --violet-w:#EBE7FD; --violet-i:#6D4AD8;
    --indigo-w:#E3E8FC; --indigo-i:#3B57D6;
    --coral-w:#FFEBE3;  --coral-i:#B44B1D;
    --amber-w:#FDF1DC;  --amber-i:#8A600A;
    --mint-w:#DDF5EC;   --mint-i:#0B7C50;
    --rose-w:#FDE7EE;   --rose-i:#BF365F;
    --cyan-w:#DEF5FD;   --cyan-i:#0B72B0;
    --sans:"Inter Variable","Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--canvas);color:var(--ink);
       -webkit-font-smoothing:antialiased}
  a{color:var(--act)} a:hover{color:var(--focus)}
  .scr{width:390px;min-height:844px;background:linear-gradient(180deg,#EFF8FD 0%,#F3FBFE 60%,#EDF7FD 100%);padding:0 16px 96px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 0 14px}
  .h1{font-size:34px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
  .kick{font-size:13px;color:var(--ink2);margin:0 0 2px}
  .card{background:var(--surface);border-radius:var(--rc);padding:14px;
        box-shadow:0 1px 2px rgb(20 70 110 / 6%)}
  .sect{font-size:13px;color:var(--ink2);margin:22px 0 8px;font-weight:500}
  .chip{width:38px;height:38px;border-radius:var(--rk);display:grid;place-items:center;flex:none;
        box-shadow:inset 0 0 0 1px color-mix(in oklab,currentColor 16%,transparent)}
  .chip.sm{width:34px;height:34px}
  .row{display:flex;align-items:center;gap:12px;min-height:60px}
  .row b{font-size:15px;font-weight:600;display:block;line-height:1.35}
  .row small{font-size:13px;color:var(--ink2);display:block;line-height:1.35}
  .grow{flex:1;min-width:0}
  .chev{color:var(--ink3);flex:none}
  .divider{height:1px;background:var(--hair);margin:0 0 0 46px}

  </style>
</helmet>

<div class="scr">
  <div style="display:flex;align-items:center;gap:8px;padding:20px 0 16px">
    <span style="color:var(--ink2)"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l-5 5 5 5"/></svg></span>
    <h2 style="flex:1;text-align:center;margin:0 34px 0 0;font-size:22px;font-weight:700">钱包</h2></div>
  <div style="background:var(--grad);border-radius:var(--rp);padding:18px;color:#fff;
              box-shadow:0 10px 24px rgb(42 160 250 / 26%)">
    <div style="font-size:12px;opacity:.85">账户余额</div>
    <div style="display:flex;align-items:baseline;gap:10px;margin-top:8px">
      <b style="font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em">18,600</b>
      <span style="font-size:13px;opacity:.85">金币</span></div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-top:4px;opacity:.9">
      <b style="font-size:20px;font-weight:600;font-variant-numeric:tabular-nums">320</b>
      <span style="font-size:12px">钻石</span></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <div style="flex:1;background:#fff;color:var(--act);border-radius:999px;min-height:44px;
                  display:grid;place-items:center;font-size:14px;font-weight:600">充值</div>
      <div style="flex:1;background:rgb(255 255 255 / 18%);border-radius:999px;min-height:44px;
                  display:grid;place-items:center;font-size:14px;font-weight:600">兑换</div></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:14px"><div class="card" style="flex:1;display:grid;justify-items:center;gap:8px;padding:16px 8px"><span class="chip sm" style="background:var(--amber-w);color:var(--amber-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="12" r="4"/><path d="M7 3l2 5M13 3l-2 5"/></svg></span><span style="font-size:12px;color:var(--ink2)">会员中心</span></div><div class="card" style="flex:1;display:grid;justify-items:center;gap:8px;padding:16px 8px"><span class="chip sm" style="background:var(--violet-w);color:var(--violet-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3"/><ellipse cx="10" cy="10" rx="7.5" ry="3.4" transform="rotate(-25 10 10)"/></svg></span><span style="font-size:12px;color:var(--ink2)">星轨年鉴</span></div><div class="card" style="flex:1;display:grid;justify-items:center;gap:8px;padding:16px 8px"><span class="chip sm" style="background:var(--mint-w);color:var(--mint-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="12" height="10.5" rx="2"/><path d="M4 9h12M7.5 3.5v3M12.5 3.5v3"/></svg></span><span style="font-size:12px;color:var(--ink2)">每日签到</span></div></div>
  <div class="card" style="margin-top:12px;display:flex;align-items:center;gap:12px">
    <span class="chip sm" style="background:var(--amber-w);color:var(--amber-i)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="12" height="8" rx="1.5"/><path d="M4 11h12M10 8v8"/><path d="M10 8S8.6 4.6 7 5.2 8.4 8 10 8zM10 8s1.4-3.4 3-2.8S11.6 8 10 8z"/></svg></span>
    <span class="grow"><b style="font-size:15px;font-weight:600;display:block">新人礼包待领取</b>
      <small style="font-size:13px;color:var(--ink2)">3 天内有效</small></span>
    <span class="chev"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg></span>
  </div>
  <p class="sect">最近流水</p>
  <div class="card" style="padding:0">
    <div class="row" style="padding:0 14px;min-height:56px"><span class="grow"><b>每日签到</b><small>2026-01-01 08:00</small></span><b style="font-size:15px;font-variant-numeric:tabular-nums;color:var(--mint-i)">+120</b></div><div class="divider" style="margin-left:14px"></div><div class="row" style="padding:0 14px;min-height:56px"><span class="grow"><b>对话消耗</b><small>2026-01-01 08:00</small></span><b style="font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink2)">−48</b></div><div class="divider" style="margin-left:14px"></div><div class="row" style="padding:0 14px;min-height:56px"><span class="grow"><b>幸运转盘</b><small>2026-01-01 08:00</small></span><b style="font-size:15px;font-variant-numeric:tabular-nums;color:var(--mint-i)">+300</b></div>
  </div>
</div>
</x-dc>
</body>
</html>
