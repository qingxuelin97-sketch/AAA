<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
  :root{
    --canvas:#EFF8FD; --surface:#FFFFFF; --grouped:#E3F1FA;
    --ink:#0A1330; --ink2:#44557A; --ink3:#58677F;
    --act:#0B72B0; --focus:#064766;
    --hair:rgb(20 70 110 / 10%); --hair2:rgb(20 70 110 / 18%);
    --rk:12px; --rc:16px; --rp:22px;
    --grad:linear-gradient(135deg,#38DAD2 0%,#2E9FF7 100%);
    --violet-w:#EBE7FD; --violet-i:#6D4AD8;
    --indigo-w:#E3E8FC; --indigo-i:#3B57D6;
    --coral-w:#FFEBE3;  --coral-i:#B44B1D;
    --amber-w:#FDF1DC;  --amber-i:#8A600A;
    --mint-w:#DDF5EC;   --mint-i:#0B7C50;
    --rose-w:#FDE7EE;   --rose-i:#BF365F;
    --cyan-w:#DEF5FD;   --cyan-i:#0B72B0;
    --sans:"Inter Variable","Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--canvas);color:var(--ink);
       -webkit-font-smoothing:antialiased}
  a{color:var(--act)} a:hover{color:var(--focus)}
  .scr{width:390px;min-height:844px;background:linear-gradient(180deg,#EFF8FD 0%,#F3FBFE 60%,#EDF7FD 100%);padding:0 16px 96px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 0 14px}
  .h1{font-size:34px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
  .kick{font-size:13px;color:var(--ink2);margin:0 0 2px}
  .card{background:var(--surface);border-radius:var(--rc);padding:14px;
        box-shadow:0 1px 2px rgb(20 70 110 / 6%)}
  .sect{font-size:13px;color:var(--ink2);margin:22px 0 8px;font-weight:500}
  .chip{width:38px;height:38px;border-radius:var(--rk);display:grid;place-items:center;flex:none;
        box-shadow:inset 0 0 0 1px color-mix(in oklab,currentColor 16%,transparent)}
  .chip.sm{width:34px;height:34px}
  .row{display:flex;align-items:center;gap:12px;min-height:60px}
  .row b{font-size:15px;font-weight:600;display:block;line-height:1.35}
  .row small{font-size:13px;color:var(--ink2);display:block;line-height:1.35}
  .grow{flex:1;min-width:0}
  .chev{color:var(--ink3);flex:none}
  .divider{height:1px;background:var(--hair);margin:0 0 0 46px}

  </style>
</helmet>

<div class="scr">
  <div class="top">
    <div><p class="kick">夜深了，旅人</p><h1 class="h1">幻域</h1>
      <p class="kick" style="margin:6px 0 0">1月1日　周四</p></div>
    <div style="display:flex;gap:16px;padding-bottom:6px;color:var(--ink2)"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5"/><path d="M13 13l3.5 3.5"/></svg><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a4 4 0 1 1 8 0c0 3 1 4 1.5 4.5h-11C5 12.5 6 11.5 6 8.5z"/><path d="M8.6 16a1.6 1.6 0 0 0 2.8 0"/></svg></div>
  </div>

  <div style="background:var(--grad);border-radius:var(--rp);padding:16px;color:#fff;
              box-shadow:0 10px 24px rgb(42 160 250 / 26%)">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:52px;height:52px;border-radius:14px;background:rgb(255 255 255 / 22%);flex:none"></div>
      <div class="grow"><b style="font-size:19px">旅人</b>
        <div style="font-size:12px;opacity:.86;margin-top:3px">● 在线</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <div style="flex:1;background:rgb(255 255 255 / 16%);border-radius:999px;padding:9px 12px;
                  font-size:14px;font-weight:600">18,600</div>
      <div style="flex:1;background:rgb(255 255 255 / 16%);border-radius:999px;padding:9px 12px;
                  font-size:14px;font-weight:600">320</div>
      <button style="flex:1.1;min-height:44px;border:0;border-radius:999px;background:#fff;color:var(--act);
                     font-size:14px;font-weight:600;font-family:inherit">签到</button>
    </div>
  </div>

  <div class="card" style="margin-top:14px;padding:16px 12px">
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px"><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--amber-w);color:var(--amber-i)"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9A1.5 1.5 0 0 1 16 5.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 4 14.5z"/><circle cx="7.5" cy="7.5" r=".9" fill="currentColor" stroke="none"/><circle cx="12.5" cy="12.5" r=".9" fill="currentColor" stroke="none"/></svg></span><span style="font-size:12px;color:var(--ink2)">转盘</span></div><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--coral-w);color:var(--coral-i)"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l4.5-11L14 12.5z"/><path d="M13 4.5v2M16.5 7l1.5-1M15 11h2.5"/></svg></span><span style="font-size:12px;color:var(--ink2)">活动</span></div><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--indigo-w);color:var(--indigo-i)"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h7a2 2 0 0 1 2 2v10H7a2 2 0 0 0-2 2z"/><path d="M5 4v14"/></svg></span><span style="font-size:12px;color:var(--ink2)">剧本</span></div><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--violet-w);color:var(--violet-i)"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="4.2"/><path d="M11.6 5.6A4.2 4.2 0 1 1 12 14"/></svg></span><span style="font-size:12px;color:var(--ink2)">互动小说</span></div><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--mint-w);color:var(--mint-i)"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="2.8"/><path d="M3.5 16c0-2.4 2-4 4.5-4s4.5 1.6 4.5 4"/><path d="M14 12.4c1.6.5 2.5 1.8 2.5 3.6"/></svg></span><span style="font-size:12px;color:var(--ink2)">社区</span></div><div style="display:grid;justify-items:center;gap:7px"><span class="chip" style="background:var(--amber-w);color:var(--amber-i)"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8v4a4 4 0 0 1-8 0z"/><path d="M6 5.5H4v1a2.5 2.5 0 0 0 2 2.4M14 5.5h2v1a2.5 2.5 0 0 1-2 2.4"/><path d="M10 12v3M7.5 16.5h5"/></svg></span><span style="font-size:12px;color:var(--ink2)">排行榜</span></div></div>
  </div>

  <p class="sect">继续你的故事</p>
  <div class="card" style="padding:0;overflow:hidden">
    <div style="height:150px;background:linear-gradient(160deg,#22323F,#3E5361);position:relative">
      <div style="position:absolute;left:14px;bottom:12px;color:#fff">
        <b style="font-size:19px;font-weight:700">猫娘咖啡店长 · 棉花</b>
        <div style="font-size:13px;opacity:.85;margin-top:3px">欢迎光临！今天也要元气满满哦～</div>
      </div>
    </div>
    <div class="row" style="padding:12px 14px;min-height:56px">
      <span class="grow" style="font-size:13px;color:var(--ink2)">上次对话 · 3 天前</span>
      <button style="min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--grad);
                     color:#fff;font-size:14px;font-weight:600;font-family:inherit">开始对话</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
